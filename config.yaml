# Glass Joe Minds — central tunable config. Injected into engine + agents.
# First-pass values (delegated by user); tune against B2 fights. See PRD.md §13.

observation:
  vitals_display: exact          # "exact" (raw health/energy out of 100) | "bands" (deterministic word read)
  guard_sags_below_energy: 45    # below this, a gassed fighter's high guard sags -> his HEAD lines read
                                 # "sagging" (openable) instead of GUARDED. The head opens via fatigue,
                                 # not for free. (Phrase only; the threshold is never shown to the LLM.)
  # Number -> phrase maps below are DETERMINISTIC and apply to BOTH fighters (own + opponent).
  # The SYSTEM PROMPT NEVER reveals these thresholds. The LLM only ever sees the phrase and must be
  # smart enough to decide what to do with it. Read top-down: highest `floor` <= value wins.
  energy_bands:   # [floor, phrase]
    - [90, "fresh and loose, full tank"]
    - [75, "breathing easy, plenty left"]
    - [60, "working but comfortable"]
    - [45, "starting to blow, arms getting heavy"]
    - [30, "tiring, breathing hard"]
    - [15, "gassing badly, legs going"]
    - [1,  "running on empty, barely keeping the guard up"]
    - [0,  "completely spent — guard's dropping and the feet are gone, wide open to clean shots"]
  health_bands:   # [floor, phrase]
    - [90, "unmarked, fresh"]
    - [75, "lightly touched up"]
    - [60, "marked up, taken some"]
    - [45, "hurt, feeling those shots"]
    - [30, "badly hurt, unsteady"]
    - [15, "on the edge, barely standing"]
    - [1,  "out on his feet, one shot from done"]

ring:
  size_ft: 16.0
  corner_margin_ft: 2.0          # within this of a wall = cornered for that direction
  min_distance_ft: 1.6           # closest the two boxers' centers may get (radius 0.7 each) — a step that
                                 # would put them inside each other is clamped to this. Below pocket (2.2)
                                 # and the shortest punch reach, so pocket fighting still works.

time:
  dt: 0.05                       # physics tick (s)
  opening_poll_interval: 0.2     # cadence both boxers are polled before the first punch (half speed)
  live_poll_interval: 0.30       # cadence an idle boxer is re-polled in the live regime (half speed)
  round_seconds: 120             # B1 full round; B2 overrides to 60
  reaction_delay_base: 0.20      # s before a chosen defense is effective (mod by reaction/energy)
                                 # tuned so telegraphed power shots (hook/uppercut) can be slipped,
                                 # but fast straight shots (jab/cross) land before a slip takes hold.

energy:
  start: 100.0
  # punch_energy = a*(s/10) + b*(v/10) + c*(s/10)*(v/10)  (fits 10/10->3, 10/1->1, 1/10->0.5)
  cost_a: 0.78
  cost_b: 0.22
  cost_c: 2.00
  # NOTE: energy cost depends on strength & speed ONLY — punch type does not affect it.
  step_energy: 0.2               # was 0.3 — footwork was draining energy too fast over a long round
  slip_energy: 0.3
  duck_energy: 0.5
  guard_energy_per_sec: 0.2
  regen_per_sec: 1.6             # was 1.2 — energy was cratering to 0 by mid-round (before health). It must
                                 # NOT bottom out before health: a faster recover keeps energy a gradually
                                 # dwindling resource while HEALTH (amplified by hurt_vulnerability) reaches
                                 # zero first. recovers whenever NOT actively winding up a punch (incl. during a hand's
                                 # recovery/reset — you get your breath back as the arm comes home, you
                                 # only hold it on the exertion of the windup). Was "not throwing at all",
                                 # which starved regen over a long round of slow recoveries.
  stamina_regen_scale: 0.6       # regen rate *= 1 + (stamina-75)/75 * this: a deeper gas tank recovers
                                 # faster between exchanges and sags later (no-op at the 75 baseline)
  ratchet_caps: [75, 50, 25]     # once below a cap, can never exceed it again this round
  zero_energy_next_hit_is_ko: false  # energy is CAPACITY, not a win condition. You do NOT win by emptying
                                 # his tank — a gassed man doesn't fall over, he just can't defend (guard
                                 # sags + slips come late) so he eats clean HEAD shots that take his HEALTH.
                                 # KO is health-only. (gassed-KO path kept config-gated for reference.)
  ko_energy_threshold: 1.0       # unused while zero_energy_next_hit_is_ko is false.
  degradation:
    full_factor: 1.0
    empty_factor: 0.6            # a gassed fighter's punches land at 60% power
    reaction_penalty_at_empty: 0.25  # a gassed fighter's defense slows hard: at empty his reaction delay
                                 # grows past most windups, so he can't slip/block in time and eats clean
                                 # shots. This is the "tired = can't defend = easy 10s land" lever.

health:
  start: 100.0
  damage_per_strength: 0.5       # 10 strength -> 5.0 base (before mults)
  jab_fixed_strength: 3.0
  punch_type_power_mult: {jab: 1.0, cross: 1.3, uppercut: 1.45, hook: 1.6}
  placement_mult:
    head_center: 1.20
    head_left:   1.00
    head_right:  1.00
    body_left:   0.90
    body_center: 0.95
  placement_health_share:
    head_center: 1.00
    head_left:   1.00
    head_right:  1.00
    body_left:   0.55
    body_center: 0.60
  placement_energy_share:
    head_center: 0.10
    head_left:   0.10
    head_right:  0.10
    body_left:   0.70
    body_center: 0.65
  block_factor: 0.30             # head shots into a FRESH high guard are reduced (was 0.20 — too strong a
                                 # wall, so the body was the only rational target until the guard sagged;
                                 # at 0.30 headhunting a fresh guard is worthwhile, so most shots go upstairs
                                 # like real boxing). NOTE: the sagging lerp endpoints are unchanged — a jab
                                 # at empty still leaks 0.75, a hook still ~1.0 — only the fresh value moved.
  block_factor_sagging: 0.75     # head block when the blocker is fully gassed: a tired guard SAGS and
                                 # leaks (honors observation's "sagging" read). Lerps block_factor ->
                                 # this as the blocker's energy falls from guard_sags_below_energy to 0.
  body_block_factor: 0.55        # body shots LEAK past a high guard (digging the body still tires him)
  block_leak_energy: 0.5
  glancing_mult: 0.6
  contest_roll: [0.9, 1.1]
  zero_health_is_ko: true
  power_scale: 0.5               # damage *= 1 + (attacker_power-75)/75 * this: a stronger boxer's same
                                 # 0-10 punch lands a bit harder (no-op at the 75 baseline)
  hurt_vulnerability_scale: 1.0  # HEALTH damage *= 1 + (1 - defender_energy/100) * this: a gassed fighter
                                 # can't defend, so the same clean shot hurts him MORE the more spent he is
                                 # (1.0x at full energy -> 2.0x at empty). This makes health ACCELERATE to
                                 # zero as energy dwindles — so the KO (health 0) lands before energy 0,
                                 # and "0 energy" reads as "been getting rocked", not the cause of the KO.
                                 # Health-only: body shots still drain energy at the flat rate.

reach:                            # feet, by punch type
  jab: 3.2
  cross: 2.8
  hook: 2.0
  uppercut: 1.8
  pocket_ft: 2.2
  attr_scale_ft: 1.5             # reach ATTR swing: effective reach += (reach-75)/75 * this (ft).
                                 # A longer-armed boxer lands from outside a shorter one's range.
  height_head_ft: 1.0           # head-shot reach += (own_height-opp_height)/75 * this: a taller boxer
                                 # tags a shorter man's (lower) head from farther; a short man must get
                                 # inside to reach a tall man's head.
  height_body_ft: 1.0           # body-shot reach += (opp_height-own_height)/75 * this: the SHORTER boxer
                                 # reaches the taller man's body more easily (it's right in front of him).

footwork:
  step_distance_ft: 1.0
  agility_scale: 0.5            # step distance *= 1 + (agility-75)/75 * this (quicker feet cover more ground)

timing:                           # phase durations (s); scaled by speed/strength/hand_speed
  # Lengthened so a human can SEE each punch: longer recovery keeps the glove extended on screen and
  # stops a hand re-firing instantly (the real "you can't throw 20/sec" limiter — the time to retract
  # and reset). Longer windups also make power shots clearly slippable.
  # HALF SPEED: every duration below (and reaction_delay_base + poll intervals above) is 2x the prior
  # value, so the whole fight runs at half pace — the relationships (jab too fast to slip, power shots
  # slippable) are preserved because everything scaled together.
  windup: {jab: 0.36, cross: 0.52, hook: 0.64, uppercut: 0.72}
  impact_ticks: 1
  recovery: {jab: 0.76, cross: 1.10, hook: 1.40, uppercut: 1.56}
  slip_duration: 0.36
  slip_recovery: 0.24
  duck_duration: 0.44
  duck_recovery: 0.30
  speed_windup_scale: 0.6        # windup *= lerp(1.0 .. this) as speed 0->10
  strength_recovery_scale: 1.4   # recovery *= lerp(1.0 .. this) as strength 0->10 (committed = slow reset)
  speed_recovery_scale: 0.85     # recovery *= lerp(1.0 .. this) as speed 0->10 (snappy hand resets quicker;
                                 # strength dominates, so a jab snaps back while a power shot stays exposed)
  combo_interval: 0.25           # gap between punches in a COMBO — shorter than any single punch's recovery,
                                 # so a combo's punches chain fast (alternating hands), overriding the normal
                                 # reset. This is what produces a visible flurry instead of one-off punches.
  combo_max_followups: 3         # at most this many follow-up punches after the lead punch (so 4 total).

# Boxer attributes (0-150, baseline 75 = neutral; every effect is a NO-OP at 75 so two 75-across boxers
# fight identically). Each stat now has a distinct mechanical effect:
#   reach   - effective reach distance (reach.attr_scale_ft): land from outside his range, or get outreached.
#   height  - head/body reach geometry (reach.height_*): tall boxer tags a short head from range; short
#             boxer reaches a tall body easily and must get inside for the head.
#   power   - damage dealt (damage.power_scale): a given 0-10 punch strength lands harder.
#   agility - speed of ALL actions: shorter windups, quicker reactions (slip/dodge in time), bigger steps.
#   chin    - head-damage resistance (already wired in damage.split).
#   stamina - energy recovery rate between exchanges (energy.regen stamina mult).
roster_default:
  reach: 75
  height: 75
  power: 75
  agility: 75
  chin: 75
  stamina: 75

# Two mismatched archetypes for the LLM-vs-LLM fight (scenario picks via red.roster / blue.roster).
rosters:
  out_boxer:                     # tall, rangy, quick stick-and-move boxer — wins at distance, fragile up close
    reach: 90
    height: 90
    power: 60
    agility: 84
    chin: 68
    stamina: 84
  pressure:                      # shorter, heavy-handed, granite-chinned pressure fighter — must get inside
    reach: 60
    height: 62
    power: 92
    agility: 66
    chin: 90
    stamina: 70
